{% extends "base.html" %}

{% block styles %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/service_header.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/appointment.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/appointment_success.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/appointment_cart.css') }}">
{% endblock %}

{% block content %}



<!-- ====================================================== -->
<!-- ==== APPOINTMENT FORM SECTION ==== -->
<!-- ====================================================== -->
<section class="appointment-section relative overflow-hidden">
  <div class="blob red"></div>
  <div class="blob blue"></div>

  <div class="appointment-card relative">

    <!-- Clock Widget -->
    <div class="absolute top-2 right-12 z-20">
      <div class="bg-white/20 backdrop-blur-md px-3 py-2 rounded-lg shadow-lg border border-white/30 inline-block w-[190px] text-center">
        <div class="text-2xl font-mono font-bold text-navy tracking-widest whitespace-nowrap">
          <span id="timeDigits">00:00:00</span>
          <span id="ampm" class="ml-1">AM</span>
        </div>
        <div id="liveDate" class="text-xs font-medium text-gray-800 mt-1">Mon, Jan 01 2025</div>
      </div>
    </div>

    <h2>Book an <span>Appointment</span></h2>

    <!-- ====== FORM START ====== -->
    <form id="appointmentForm" class="space-y-6" autocomplete="off" novalidate>

      <!-- Search Service -->
      <div>
        <label for="searchInput">🔍 Search Test / Service</label>
        <input id="searchInput" type="text" placeholder="Start typing… (e.g. Blood Test, ECG)">
        <div id="resultsPanel" class="hidden mt-2 border border-gray-200 rounded-xl bg-white shadow-lg max-h-60 overflow-y-auto">
          <div id="resultsContainer" class="divide-y divide-gray-100"></div>
        </div>
        <p class="text-xs text-gray-500 mt-1">Type at least 2 letters to see results.</p>
      </div>

      <!-- Category & Subcategory -->
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <label for="serviceCategory">Select Category</label>
          <select id="serviceCategory" name="serviceCategory">
            <option value="">-- Select Category --</option>
          </select>
        </div>

        <div id="subcategoryWrapper" class="hidden">
          <label for="serviceSubcategory">Select Test / Sub-Service</label>
          <select id="serviceSubcategory" name="serviceSubcategory">
            <option value="">-- Select Test --</option>
          </select>
        </div>
      </div>

      <!-- Add to Cart -->
      <div class="flex justify-center">
        <button type="button" id="addToCartBtn" class="add-cart-btn">➕ Add Test to Cart</button>
      </div>

      <!-- Date & Time -->
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <label for="appointmentDate">Preferred Date</label>
          <input type="date" id="appointmentDate" name="appointmentDate">
        </div>
        <div>
          <label for="appointmentTime">Preferred Time</label>
          <select id="appointmentTime" name="appointmentTime">
            <option value="">-- Select Time --</option>
            <option>Morning (9AM - 12PM)</option>
            <option>Afternoon (12PM - 4PM)</option>
          </select>
        </div>
      </div>

      <!-- Personal Info -->
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <label for="fullName">Full Name *</label>
          <input type="text" id="fullName" name="fullName" required>
        </div>
        <div>
          <label for="sex">Sex *</label>
          <select id="sex" name="sex" required>
            <option value="">-- Select --</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>
        <div>
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" name="phone" placeholder="+234..." required>
        </div>
        <div>
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" placeholder="you@email.com" list="emailSuggestions" required>
          <datalist id="emailSuggestions">
            <option value="@gmail.com"></option>
            <option value="@outlook.com"></option>
            <option value="@hotmail.com"></option>
            <option value="@yahoo.com"></option>
            <option value="@icloud.com"></option>
          </datalist>
        </div>
        <div class="md:col-span-2">
          <label for="address">Address (Optional)</label>
          <input type="text" id="address" name="address">
        </div>

        <div class="md:col-span-2">
          <label for="message">Message (Optional)</label>
          <textarea id="message" name="message" rows="3" placeholder="Any extra note for us…"></textarea>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col md:flex-row justify-center items-center gap-6 mt-4">
        <button type="button" id="bookOnlyBtn">📅 Book Only</button>
        <button type="button" id="bookPayBtn">💳 Book & Pay Later</button>
      </div>

      <p class="appointment-hint">
        Or call us anytime at <span>+234-7035765000</span>
      </p>

    </form>
    <!-- ====== FORM END ====== -->
  </div>
</section>

<!-- 🛒 CART DRAWER -->
<div id="cartDrawer" class="cart-drawer hidden">
  <div class="cart-header">
    <h3>Your Selected Tests</h3>
    <button id="closeCartBtn" class="cart-close">×</button>
  </div>
  <ul id="cartItems" class="cart-items"></ul>
  <div class="cart-footer">
    <button id="clearCartBtn" class="clear-cart">Clear</button>
    <button id="proceedCartBtn" class="proceed-cart">Proceed</button>
  </div>
</div>

<!-- 🧾 Floating Cart Button -->
<button id="floatingCartBtn" class="floating-cart">
  🧾 <span id="cartBadge">0</span>
</button>

<!-- ==== SUMMARY MODAL ==== -->
<div id="summaryModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-8 animate-fade-in">
    <h2 class="text-2xl font-bold text-navy mb-4">Confirm Your Booking</h2>
    <div id="summaryContent" class="space-y-3 text-gray-700"></div>
    <div class="flex justify-end gap-4 mt-6">
      <button id="editBtn" class="px-5 py-2 border rounded-xl hover:bg-gray-50">Edit</button>
      <button id="cancelBtn" class="px-5 py-2 border rounded-xl hover:bg-gray-50">Cancel</button>
      <button id="confirmBtn" class="px-5 py-2 bg-red-600 text-white rounded-xl hover:bg-red-700">Confirm</button>
    </div>
  </div>
</div>

<script id="test-data" type="application/json">
  {{ test_data | tojson }}
</script>

<script>
  (function () {
    try {
      window.testData = JSON.parse(document.getElementById('test-data').textContent);
    } catch (e) {
      console.error('Failed to parse test data JSON', e);
      window.testData = {};
    }
  })();
</script>

<!-- ================= External JS ================= -->
<script src="{{ url_for('static', filename='js/appointment-timer.js') }}"></script>
<script src="{{ url_for('static', filename='js/clock.js') }}"></script>
<script src="{{ url_for('static', filename='js/service_header.js') }}"></script>
<script src="{{ url_for('static', filename='js/email_suggestion.js') }}"></script>
<script src="{{ url_for('static', filename='js/appointment.js') }}"></script>

{% endblock %}
