<img src="https://embed.tawk.to/_s/v4/assets/images/attention-grabbers/163-r-br.svg" alt="Chat attention grabber" style="width: 150px; height: 99px;">






  <!-- Messages -->
  <div id="chat-messages" class="p-4 flex-1 overflow-y-auto space-y-4 scrollbar-thin scrollbar-thumb-gray-300">
    <!-- Greeting (Pinned) -->
    <div class="flex items-start space-x-3 sticky top-0 bg-white/80 backdrop-blur-sm z-10 pb-2">
      <img src="{{ url_for('static', filename='images/bot.jpg') }}" 
           alt="Bot" class="w-10 h-10 rounded-full object-cover shadow-md">
      <div class="bg-gradient-to-r from-indigo-50 to-purple-50 text-gray-800 p-3 rounded-xl max-w-xs shadow">
        <p class="text-sm">👋 Hi! I’m your Epiconsult Assistant. Do you want to see a doctor at the Clinic, book a Specialist, or explore Diagnostics tests?</p>
      </div>
    </div>

    <!-- Quick Buttons -->
<div class="flex flex-wrap gap-2 ml-12">
  <button
    type="button"
    data-message="I want a General Consultation"
    class="chat-quick-btn bg-gradient-to-r from-green-500 to-emerald-600 text-white px-4 py-1.5 rounded-full text-xs shadow hover:scale-105 transition">
    🏥 General Consultation
  </button>

  <button
    type="button"
    data-message="Tell me about Sickle Cell services"
    class="chat-quick-btn bg-gradient-to-r from-purple-500 to-pink-600 text-white px-4 py-1.5 rounded-full text-xs shadow hover:scale-105 transition">
    🧬 Sickle Cell
  </button>

  <button
    type="button"
    data-message="I need a Specialist appointment"
    class="chat-quick-btn bg-gradient-to-r from-indigo-500 to-blue-600 text-white px-4 py-1.5 rounded-full text-xs shadow hover:scale-105 transition">
    👨‍⚕️ Specialist
  </button>

  <button
    type="button"
    data-message="Show me Radiology services"
    class="chat-quick-btn bg-gradient-to-r from-pink-500 to-rose-600 text-white px-4 py-1.5 rounded-full text-xs shadow hover:scale-105 transition">
    🩻 Radiology
  </button>

  <button
    type="button"
    data-message="What Laboratory tests do you offer?"
    class="chat-quick-btn bg-gradient-to-r from-yellow-500 to-orange-600 text-white px-4 py-1.5 rounded-full text-xs shadow hover:scale-105 transition">
    🧪 Laboratory
  </button>

  <button
    type="button"
    data-message="Tell me about Teleconsultation"
    class="chat-quick-btn bg-gradient-to-r from-blue-500 to-cyan-600 text-white px-4 py-1.5 rounded-full text-xs shadow hover:scale-105 transition">
    💻 Teleconsultation
  </button>

  <button
    type="button"
    data-message="I want to contact support"
    class="chat-quick-btn bg-gradient-to-r from-gray-700 to-gray-900 text-white px-4 py-1.5 rounded-full text-xs shadow hover:scale-105 transition">
    ☎ Contact Support
  </button>
</div>

<!-- 🗑️ Clear History Button -->
<div class="mt-3 ml-12">
  <button
    type="button"
    id="chat-clear"
    class="bg-red-500 text-white px-3 py-1 rounded-full text-xs shadow hover:bg-red-600 transition">
    🗑️ Clear History
  </button>
</div>


  <!-- Input -->
  <div id="chat-input-bar" class="p-3 border-t border-white/20 bg-white/40 backdrop-blur-md
                                flex items-center space-x-2 transform transition-transform duration-200 translate-y-0">
    <input type="text" id="chat-input" placeholder="Type your message..."
           class="flex-1 p-3 bg-white/60 border border-white/30 rounded-full 
                  focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm placeholder-gray-500">

    <!-- Voice -->
    <button id="chat-voice"
            class="bg-white/70 hover:bg-white text-indigo-600 p-3 rounded-full shadow transition active:scale-95"
            title="Voice">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 14a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v4a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/>
      </svg>
    </button>

    <!-- Send -->
   <button type="button" id="chat-send"
            class="bg-gradient-to-tr from-indigo-600 to-purple-600 text-white p-3 rounded-full shadow 
                   transition hover:scale-110 active:scale-95"
            title="Send">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3.4 2.6a1 1 0 0 1 1.04-.08l16 8a1 1 0 0 1 0 1.84l-16 8A1 1 0 0 1 3 20.5l2.9-6.53 7.4-1.47-7.4-1.47L3 3.5a1 1 0 0 1 .4-0.9Z"/>
      </svg>
    </button>
  </div>
</div>
